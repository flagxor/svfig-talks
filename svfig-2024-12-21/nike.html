'  July 4 - lets play radius of curvature games
'         and internet comment is that the radius of curvature in 3 space
'   can be found from the distance of three points on a 3 space circle
'  http://www.physicsforums.com/showthread.php?t=173847
'      Greek000
'
'Well, you only need to find the distances between these three points in 3D space, 
'which correspond to the lengths of the triangle sides. This is an easy task. 
'If we name these distances a, b, c then the radius R of the circumscribed circle is:
'
'                  abc
'     R = ---------------------------------------------------
'          SQR( 2a^2b^2 + 2b^2c^2 + 2c^2a^2 - a^4 -b - c^4 )
'
'When the points are colinear the quantity inside the square root becomes zero, 
'and therefore the radius becomes infinite as it should.  

'
'  Nike dimensions are in the King's English units, not archaic Greek units !!!
'    Azimuth   is in degrees, from north, clockwise -> east
'    Elevation is in degrees, from horizontal -> vertical

'         which retains the flavor of QBASIC in 32 bit mode.
'           case sensitive
'         and is much more fussy about declaring floats and types
'  the book says undeclared variables are single precision ! but I doubt it!
'               DIM bytevar  AS BYTE
'  %  integer   +-32K     SHORT   DEFSHORT
'  &  long integer  +-2 billion
'  !  single precision float   7 places*10^+-38  SINGLE  DEFSNG
'  #  double precision float 15 places*10^+-300
'  $  st-ring

' the 'target' should be in a circle contained in the 'body' area

IdleLoop: 
CONST DynamicsInterval = 0.1

    ' read keyboard and mouse sim state every 0.1 sec
    DIM k$ ' keyboard control input character

    IF K$ <> "" THEN
        SELECT CASE K$
        CASE "p"
            WHILE INKEY$ = "": SLEEP (10):WEND 
        CASE "q" 
            END
            GOTO ExitPause
        CASE chr$( 27 )  ' Esc key
            END
            GOTO ExitPause

    END IF ' K$
    GETMOUSE MouseXCurrent, MouseYCurrent, , MouseButtonsCurrent  ' only GETMOUSE !!
    MouseYCurrent *= MouseFF_Y : ' don't seem to need it for X
    IF MouseXCurrent <> MouseXPrevious _
        or MouseYCurrent <> MouseYPrevious _

        'IF  1 THEN 'Debug then

    IF SimRunMode = 2 Then
        PauseTimeAdjust += DynamicsInterval  ' hold time  ;-))

    END IF ' SimRunMode

                TargetDesignatedStatus = 0 ' no longer valid
                TTR_RangeUnitYards = TTR_RangeMaxYards - 10
            ELSE ' tracked, update values
                TTR_RangeUnitYards = TTR_RG
            END IF 
        END IF
    END IF
    
    IF TTR_RangeUnitYards < 8000 THEN : TTR_RangeUnitYards = 8000 : END IF
    IF TargetTrackedStatus =0 THEN 
        TTR_AGC = 1 
    ELSE 
        TTR_AGC = (TTR_RangeUnitYards/TTR_RangeMaxYards)^4 + TTR_BurstDither -1 
    END IF
    ' top is  fewer than bottom, 0 is on top
    ' split top and bottom for different look ?
    DIM XPixels, YPixelsTop, YPixelsBot
    XPixels = 4+INT(RND()*(TTR_WidthPixels-4)) ' get random index, starting at one, along slices, after main bang
    ' blank old line
    YPixelsTop = TTR_ArrayTop(XPixels)  ' get past length
    YPixelsBot = TTR_ArrayBot(XPixels)  ' get past length
    LINE (TTR_X_Offset+XPixels,TTR_Y_Offset+YPixelsTop-1)-(TTR_X_Offset+XPixels,TTR_Y_Offset+YPixelsBot+1),0' blank past fuzz
    ' compute new fuzz - ignore the target display for a while
    
    YPixelsTop = -(INT(SQR(RND())*TTR_MaxFuzzPixels*TTR_AGC))' +TTR_ArrayTop(XPixels-1)/2)   '  
    YPixelsBot = (INT(SQR(RND())*TTR_MaxFuzzPixels*TTR_AGC))' +TTR_ArrayBot(XPixels-1)/2)   ' 
    IF YPixelsTop > YPixelsBot THEN ' flip 'em
        SWAP YPixelsBot , YPixelsTop
    END IF ' flip em
    
    
    ' determine the range gate width and offset
    DIM YNotch, NotchLeftSideYards, NotchLeftSidePixels,  NotchRightSideYards , NotchRightSidePixels , TarXPixels 
    YNotch = 0
    ' OK - we have TTR_RangeUnitYards, 
    NotchLeftSideYards = TTR_RangeUnitYards-TTR_NotchWidthYards/2 'Yards to left side of notch
    NotchLeftSidePixels = INT(NotchLeftSideYards/TTR_MainYardsPerPixel)
    NotchRightSideYards = TTR_RangeUnitYards+TTR_NotchWidthYards/2 'Yards to right side of notch
    NotchRightSidePixels = INT(NotchLeftSidePixels + TTR_NotchWidthPixels)
    ' now work in one target
    
    
    IF NotchLeftSidePixels >  XPixels THEN ' near side of notch
        'Zone = 1 less than range gate
        'update using XPixels, Range of target is normal
        ' find target slice
        TarXPixels = INT(TTR_RangeUnitYards/TTR_MainYardsPerPixel)
        ' If TarXPixels = XPixels then
        '     YPixelsTop += TTR_MaxFuzzPixels ' show target, this is AGC base
        ' End if ' TarXPixels = XPixels
        
    ELSEIF NotchLeftSidePixels =  XPixels _  ' edge of near side of notch
        OR NotchRightSidePixels =  XPixels  THEN 
        TarXPixels = INT(TTR_RangeUnitYards/TTR_MainYardsPerPixel)
        YPixelsBot  = TTR_NotchDepthPixels 
        
        
    ELSEIF NotchRightSidePixels <  XPixels THEN ' -2 then ' -3  then  ' far side of notch
        ' Zone = 3  greater than range gate
        ' update using XPixels, Range of target _+ something
        TarXPixels = INT(TTR_RangeUnitYards/TTR_MainYardsPerPixel) + TTR_NotchWidthPixels 
        'If TarXPixels = XPixels then
        '    YPixelsTop += TTR_MaxFuzzPixels ' show target
        'End if ' TarXPixels = XPixels
        
    ELSE ' in notch   - try to lower the noise frequency
        ' find average of top and bottom of left (or right) line as starting point
        DIM LeftAvg, YFuzzNotch, TargetMultiplier
        IF NotchLeftSidePixels+(TTR_NotchWidthPixels/2) <  XPixels THEN 
            LeftAvg = (TTR_ArrayTop(XPixels-1)+TTR_ArrayBot(XPixels-1))/2  ' this is starting point
        ELSE
            LeftAvg = (TTR_ArrayTop(XPixels+1)+TTR_ArrayBot(XPixels+1))/2  ' this is starting point
        END IF        
        YFuzzNotch = INT((2*(RND())-1)*TTR_MaxFuzzPixels*TTR_AGC)  + TTR_NotchDepthPixels ' top of noise, not good
        TarXPixels = INT(NotchLeftSidePixels + TTR_NotchWidthPixels/2 _   ' generate target signal 
        + (TTR_RangeUnitYards-TTR_RangeUnitYards)/TTR_NotchYardsPerPixel )
        ' form target image     
        TargetMultiplier = (10-ABS(TarXPixels - XPixels))/10   
        IF TargetMultiplier > 0 AND  TargetTrackedStatus <> 0 THEN 
            YFuzzNotch -= TTR_MaxFuzzPixels*TargetMultiplier
        END IF
        ' now determine top and bottom
        IF YFuzzNotch <LeftAvg THEN
            YPixelsTop  = YFuzzNotch 
            YPixelsBot  = LeftAvg
        ELSE
            YPixelsTop = LeftAvg 
            YPixelsBot  = YFuzzNotch
        END IF
        IF YPixelsTop  > YPixelsBot THEN
            SWAP YPixelsTop,YPixelsBot 
        END IF
    END IF
    LINE (TTR_X_Offset+XPixels,TTR_Y_Offset+YPixelsTop) _
    -(TTR_X_Offset+XPixels,TTR_Y_Offset+YPixelsBot),200*256 ' write fuzz
    TTR_ArrayTop(XPixels) = YPixelsTop  ' save for future erasing  ;-)
    TTR_ArrayBot(XPixels) = YPixelsBot
    
    RETURN

    MTR_Display:

    DIM AS INTEGER MTR_Points_Y(10) = {0,0,0,0,0,0,0,0,0}

    ' Point 3 - left side of notch

    PPI_OnePulse:
    CONST PPI_AzDelta = 0.1*Deg2Rad ' delta = 0.1 degrees
    
    '    WHILE INKEY$ = "": sleep (1):WEND 
    'sleep (1)
    
    DIM PPI_AzRads,  PPI_AzRadsOff60, PPI_AzRadsOff120
    DIM CosAz, SinAz, CosAzOff60, SinAzOff60, CosAzOff120, SinAzOff120
    PPI_AzRads -= PPI_AzDelta    ' rotate clockwise
    IF PPI_AzRads < -(Pi -PPI_AzDelta/2)  THEN
        PPI_AzRads = Pi '0 ' start in a fixed place - stability?
        PPI_ScanCount = PPI_ScanCount + 1
    END IF
    CosAz = COS(PPI_AzRads)
    SinAz = SIN(PPI_AzRads)
    
    PPI_AzRadsOff60 = PPI_AzRads-Pi/3  
    IF PPI_AzRadsOff60 < 0 THEN
        PPI_AzRadsOff60 +=  PiTimes2
    END IF
    
    PPI_AzRadsOff120 =  PPI_AzRads-2*Pi/3  
    IF PPI_AzRadsOff120 < 0 THEN
        PPI_AzRadsOff120 += PiTimes2
    END IF
    CosAzOff60 = COS(PPI_AzRadsOff60)
    SinAzOff60 = SIN(PPI_AzRadsOff60)
    
    CosAzOff120 = COS(PPI_AzRadsOff120)
    SinAzOff120 = SIN(PPI_AzRadsOff120)
    
    IF 0 THEN 'INT(PPI_AzRads*Rad2Deg*1.5 ) = INT(DesignateAzRads*Rad2Deg*1.5)  then   ' make Target Select ring
        IF ThisTime > LastDesignateWriteTime + 1  _
        AND TargetDesignatedStatus > 0 THEN ' no more than once per second
        LastDesignateWriteTime = ThisTime
        ' draw a ring about the designated point - 
        DIM DesignateCenterPixX, DesignateCenterPixY
        DesignateCenterPixX = DesignateRadiusPix*COS((DesignateAzRads) )
        DesignateCenterPixY = DesignateRadiusPix*SIN((DesignateAzRads) )
        FOR w_f = 0 TO PiTimes2 STEP 0.01
            x_i = 20*COS(w_f)+PPI_MaxRad+DesignateCenterPixX
            y_i = 20*SIN(w_f)+PPI_MaxRad+DesignateCenterPixY
            PSET(PPI_XOffSet+x_i, _
            PPI_YBottom-y_i), Yellow 
            PPI_DispValu(x_i,y_i) = 255
        NEXT I
    END IF
    
END IF
IF ABS(PPI_AzRads - TTR_Az) < 10*Deg2Rad THEN   ' make TTR Tracking Cross 
    DIM TrackingCrossRangeEnable, TrackingCrossAz
    TrackingCrossRangeEnable = 1
    IF INT(PPI_AzRads*Rad2Deg*0.75 ) = INT(TTR_Az*Rad2Deg*0.75)  THEN  ' 1/0.75  degreewide radius
        TrackingCrossAz = 1
    ELSE
        TrackingCrossAz = 0
    END IF
ELSE
    TrackingCrossRangeEnable = 0
END IF

DIM PPI_AzRangeBuckets(TargetsMax) AS INTEGER ' how is this used ???
DIM PPI_AzRangeBucketCnt AS INTEGER
PPI_AzRangeBucketCnt= 0 ' bucket zero is count 
DIM PPI_AzIFFBuckets(TargetsMax) AS INTEGER ' how is this used ???
DIM PPI_AzIFFBucketCnt AS INTEGER
PPI_AzIFFBucketCnt= 0 ' bucket zero is count 
FOR i_i = 1 TO TargetsMax
    w_f  = TargetAZ(i_i)  ' radians
    
    ' calculate the widening of az at close range
    IF ABS(w_f  - PPI_AzRads) < 10*Deg2Rad THEN 'AND  TargetRG(i) > 1000 Then ' not good near 0 deg
        k_f = 27 - 2*LOG(TargetRG(i_i)) 
        IF ABS(w_f - PPI_AzRads) < k_f*Deg2Rad THEN ' not good near 0 deg
            ' got an azimuth hit
            PPI_AzRangeBucketCnt += 1 ' increment bucket counter
            PPI_AzRangeBuckets(PPI_AzRangeBucketCnt) = INT(TargetRG(i_i)*PPI_MaxRad/PPI_MaxRange)' convert range to pixels
        END IF
    END IF
    ' do IFF
    IF ABS(w_f  - PPI_AzRads) < 20*Deg2Rad AND IFF_1ButtonStatus = 1 AND TargetIFF(i_i) = 1 THEN  
        k_f = 35 - 2*LOG(TargetRG(i_i)) 
        IF ABS(w_f - PPI_AzRads) < k_f*Deg2Rad THEN ' not good near 0 deg
            ' got an azimuth hit - no problem if not in display area - not displayed -                
            PPI_AzIFFBucketCnt += 1 ' increment bucket counter
            PPI_AzIFFBuckets(PPI_AzIFFBucketCnt) = INT((TargetRG(i_i)*PPI_MaxRad/PPI_MaxRange)+ 8)' convert range to pixels
        END IF
    END IF
NEXT i_i

CONST RadiusStepPix = 0.8
DIM Radius
FOR Radius = 2 TO PPI_MaxRad STEP RadiusStepPix
    x_i = Radius*CosAz + PPI_MaxRad
    y_i = Radius*SinAz + PPI_MaxRad
    ' process 0 degrees
    
    IF PPI_DispFade(x_i,y_i) <> 0 THEN
        
        DIM PixVal AS INTEGER
        PixVal = (RND(1)*255*0.3)  *(1-Radius/PPI_MaxRad) ' make noise
        IF PPI_AzRangeBucketCnt <> 0 THEN
            FOR i_i = 1 TO PPI_AzRangeBucketCnt 
                IF  ABS(Radius -  PPI_AzRangeBuckets(i_i)) < 2 THEN
                    PixVal = 225  ' target az and range
                    '  Print " Az = ";PPI_AzRads," Radius = ";Radius
                END IF
            NEXT ' i_i = 1 to PPI_AzRangeBucketCnt Then
        END IF ' PPI_AzRangeBucketCnt <> 0 then
        'Do IFF
        IF PPI_AzIFFBucketCnt <> 0 THEN
            FOR i_i = 1 TO PPI_AzIFFBucketCnt 
                IF  ABS(Radius -  PPI_AzIFFBuckets(i_i)) < 2 THEN
                    PixVal = 225  ' target az and range
                    '  Print " Az = ";PPI_AzRads," Radius = ";Radius
                END IF
            NEXT ' i_i = 1 to PPI_AzRangeBucketCnt Then
        END IF ' PPI_AzRangeBucketCnt <> 0 then
        
        
        IF TrackingCrossRangeEnable <> 0 THEN  ' work on TTR  Tracking Cross
            w_f = TTR_RangeUnitYards/PPI_Pix2Yard
            IF INT(Radius) = INT(w_f) THEN  ' ring segment
                PixVal = 255
            END IF 
            IF ABS(w_f - Radius) < 15 AND TrackingCrossAz <> 0 THEN           ' radius segment
                PixVal = 255
            END IF 
        END IF           
        PixVal += PPI_DispValu(x_i,y_i) ' sum residual and present
        IF PixVal > 255 THEN   ' prevent overflow
            PixVal = 255
        END IF             
        w_i = PixVal*256 + PixVal*65536 ' make yellow from red & green
        
        PSET (PPI_XOffSet+x_i, PPI_YBottom-y_i), w_i ' place pixel
        
        
        PPI_DispValu(x_i,y_i) = PixVal  ' remember value, saves PEEK
        PPI_DispFade(x_i,y_i) = 0       ' set initial fade control value
        ' the vector is now swept from positive to negative 
        '     the below got confused, or at least I did, re-hacking it 
        ' sequence should be 0, 300, 240, 180, 120, 60
        
    END IF  ' PPI_DispFade(x,y) <> 0 then
    ' process 180 degrees behind
    x_i = -Radius*CosAz + PPI_MaxRad
    y_i = -Radius*SinAz + PPI_MaxRad
    IF PPI_DispFade(x_i,y_i) = 2 THEN
        DIM Wd2 AS INTEGER
        W_i = PPI_DispValu(x_i,y_i) 
        Wd2 =  W_i*PPI_FadeFactor 
        PPI_DispValu(x_i,y_i) = Wd2
        w_i = Wd2*256 + Wd2*65536
        PSET (x_i +PPI_XOffSet,PPI_YBottom-y_i), w_i
        PPI_DispFade(x_i,y_i) = 3
    END IF
    ' process 60 degrees ahead,, not behind , first 
    x_i = Radius*cosAzOff60 + PPI_MaxRad
    y_i = Radius*sinAzOff60 + PPI_MaxRad
    
    IF PPI_DispFade(x_i,y_i) = 4 THEN    
        W_i = PPI_DispValu(x_i,y_i) 
        Wd2 =  W_i*PPI_FadeFactor   
        PPI_DispValu(x_i,y_i) = Wd2
        w_i = Wd2*256 + Wd2*65536
        PSET (x_i + PPI_XOffSet,PPI_YBottom-y_i), w_i
        PPI_DispFade(x_i,y_i) = 5
    END IF
    ' process 240 degrees behind
    x_i = -Radius*CosAzOff60 + PPI_MaxRad
    y_i = -Radius*SinAzOff60 + PPI_MaxRad
    IF PPI_DispFade(x_i,y_i) = 1 THEN
        W_i = PPI_DispValu(x_i,y_i) 
        Wd2 =  W_i*PPI_FadeFactor   
        PPI_DispValu(x_i,y_i) = Wd2
        w_i = Wd2*256 + Wd2*65536
        PSET (x_i +  PPI_XOffSet,PPI_YBottom-y_i), w_i
        PPI_DispFade(x_i,y_i) = 2
    END IF
    ' process 120 degrees behind
    x_i = Radius*CosAzOff120 + PPI_MaxRad
    y_i = Radius*SinAzOff120 + PPI_MaxRad
    IF PPI_DispFade(x_i,y_i) = 3 THEN
        w_i = PPI_DispValu(x_i,y_i) 
        Wd2 =  w_i*PPI_FadeFactor   
        PPI_DispValu(x_i,y_i) = Wd2
        w_i = Wd2*256 + Wd2*65536
        PSET (x_i + PPI_XOffSet,PPI_YBottom-y_i), w_i
        PPI_DispFade(x_i,y_i) = 4
    END IF
    ' process 300 degrees behind
    x_i = -Radius*CosAzOff120 + PPI_MaxRad
    y_i = -Radius*SinAzOff120 + PPI_MaxRad
    IF PPI_DispFade(x_i,y_i) = 0 THEN
        W_i = PPI_DispValu(x_i,y_i) 
        Wd2 =  W_i*PPI_FadeFactor   
        PPI_DispValu(x_i,y_i) = Wd2
        w_i = Wd2*256 + Wd2*65536
        PSET (x_i +  PPI_XOffSet,PPI_YBottom-y_i), w_i
        PPI_DispFade(x_i,y_i) = 1
    END IF
    NextRadius:      
NEXT Radius
'sleep(1)
RETURN

ComputeTargetPositions:

FOR i_i = 1 TO TargetsMax
    Target_X(i_i) += TargetDX(i_i)*DynamicsInterval ' intgrate
    Target_Y(i_i) += TargetDY(i_i)*DynamicsInterval ' 
    Target_Z(i_i) += TargetDZ(i_i)*DynamicsInterval ' 
    TargetAZ(i_i) = ATAN2(Target_Y(i_i),Target_X(i_i)) '   Radians
    w_f= SQR(Target_X(i_i)*Target_X(i_i)+Target_Y(i_i)*Target_Y(i_i)) ' GroundRangeyards
    TargetEL(i_i) = ATAN2(Target_Z(i_i),w_f) ' Radians
    TargetRG(i_i) = SQR(Target_X(i_i)*Target_X(i_i)+Target_Y(i_i)*Target_Y(i_i)+Target_Z(i_i)*Target_Z(i_i)) ' yards
    IF TargetDesignatedStatus= i_i THEN
        DIM Gs, v_f, PrevTargetDesignatedStatus, PrevTTR_X, PrevTTR_Y, PrevTTR_Z
        DIM BaseTargetMovementAngleXY, BaseTargetMovementAngleZ, GOffSet
        ' normalized evasion value
        CONST EP = 14   ' EvasionPeriod
        ' the constant 10 is to get more digits from MOD, increase resolution
        CONST ModRes = 10
        DIM EP_Res = EP*ModRes
        ' v_f = SIN(Pi/2 * 2*ABS((70)-((ThisTime*10) MOD 140)/70)-1)' 14 second period
         v_f = SIN(Pi/2 * 2*ABS((EP_Res/2)-((ThisTime*ModRes) MOD EP_Res)/(EP_Res/2))-1)
        Gs = EvasionGs * v_f
        GOffSet = 245 * Gs
        '  dither these according to the travel vector and Gs
        '  general plan, dither about the base course, ie,
        IF EvasionGs = 0.0  THEN
            TTR_X = Target_X(i_i)  ' yards 
            TTR_Y = Target_Y(i_i)
            TTR_Z = Target_Z(i_i)
            locate 3,86
           'print using " dither yds = ####.#   ";GOffSet
            print       "                       " 

        ELSE
            BaseTargetMovementAngleXY = ATAN2(TargetDY(i_i),TargetDX(i_i)) '   Radians
            BaseTargetMovementAngleZ  = _
                ATAN2(TTR_DZ,SQR(TargetDX(i_i)*TargetDX(i_i) + TargetDY(i_i)*TargetDY(i_i))) '   Radians
            TTR_X = Target_X(i_i) + GOffSet*SIN(BaseTargetMovementAngleXY) ' yards 
            TTR_Y = Target_Y(i_i) + GOffSet*COS(BaseTargetMovementAngleXY) ' yards 
            TTR_Z = Target_Z(i_i) + GOffSet*COS(BaseTargetMovementAngleZ) ' yards
            'locate 3,86
           ' print using " dither yds = ####.#   ";GOffSet
        END IF
            
        ' compute these based on (present values - previous values)/DynamicsInterval
        IF TargetDesignatedStatus <> PrevTargetDesignatedStatus  _
            OR EvasionGs = 0.0  THEN
            TTR_DX = TargetDX(i_i)  ' yards/sec - initialization on designate change
            TTR_DY = TargetDY(i_i) 
            TTR_DZ = TargetDZ(i_i) '
            PrevTargetDesignatedStatus = TargetDesignatedStatus
        ELSE
            TTR_DX = (TTR_X - PrevTTR_X)/DynamicsInterval
            TTR_DY = (TTR_Y - PrevTTR_Y)/DynamicsInterval 
            TTR_DZ = (TTR_Z - PrevTTR_Z)/DynamicsInterval 
        END IF
        PrevTTR_X = TTR_X 
        PrevTTR_Y = TTR_Y
        PrevTTR_Z = TTR_Z
        
        ' hopefully the following will be good enough based on non-dithered values
        TTR_AZ = TargetAZ(i_i)  ' radians
        TTR_EL = TargetEL(i_i)
        TTR_RG = TargetRG(i_i)  ' target slant range yards
        TTR_GroundRange = w_f ' yards
        TTR_GndSpd = SQR(TargetDX(i_i)*TargetDX(i_i) + TargetDY(i_i)*TargetDY(i_i))
    END IF ' i_i
NEXT ' i_i = 1 to TargetsMax
RETURN

MouseInPPI:   ' check if mouse in PPI, if yes, enable TargetDesignated, TargetTracked, Computer settled

DIM CalPPI_AzRad, CalPPI_AzDeg, CalPPI_RadiusPix,CalPPI_RadiusYards 
IF MouseButtonsCurrent = 0 OR  MSL_Status <> 0 THEN
    RETURN ' left button not depressed,  missile status <> 0
END IF   
IF MouseXCurrent >= PPI_XOffSet AND MouseXCurrent <= PPI_XOffSet + 2*PPI_MaxRad _
AND MouseYCurrent >= PPI_YOffSet AND MouseYCurrent <= PPI_YOffSet + 2*PPI_MaxRad THEN
    x_i = MouseXCurrent - (PPI_XOffSet + PPI_MaxRad)
    y_i = MouseYCurrent - (PPI_YOffSet + PPI_MaxRad)
    CalPPI_RadiusPix = SQR(x_i*x_i+y_i*y_i)
    CalPPI_RadiusYards = CalPPI_RadiusPix*PPI_Pix2Yard
    '   locate EngineeringPrintY+6,EngineeringPrintX
    '   Print Using "MouseYards ###,###";CalPPI_RadiusYards
    ' compute DesignateAzDeg ' in degrees  
    CalPPI_AzRad = ATAN2(-y_i,x_i) ' in Rad
    CalPPI_AzDeg = CalPPI_AzRad*Rad2Deg+90 'degress
    IF CalPPI_AzDeg >=360 THEN : CalPPI_AzDeg -= 360 : END IF
    IF CalPPI_AzDeg < 0 THEN : CalPPI_AzDeg += 360 : END IF
    '    locate EngineeringPrintY+7,EngineeringPrintX
    '    Print Using "MouseAzDeg     ###";CalPPI_AzDeg
    ' see if an 'aircraft' is near Designate Az and Range
    'locate 3,85
    'print "xxxx"; x_i;"   ";y_i;"   "

    ' compute  DesignateRadiusPix  ' in pixels
    TargetDesignatedStatus = 0 : TargetTrackedStatus = 0 : ComputerSettledStatus = 0
    FOR i_i = 1 TO TargetsMax  ' search existing aircraft, compare
        IF ABS(TargetAZ(i_i) - CalPPI_AzRad) < 10*Deg2Rad _  ' Az angle +- 10 degrees
        AND ABS(CalPPI_RadiusYards -  TargetRG(i_i)) < 10000 THEN ' range +- 10000 yards
        DIM CalTargSlantRange 
        CalTargSlantRange = SQR(Target_X(i_i)*Target_X(i_i)+Target_Y(i_i)*Target_Y(i_i)+ _
                Target_Z(i_i)*Target_Z(i_i) )  ' slant range - fix corner condition
        IF  CalTargSlantRange < TTR_RangeMaxYards - 1000  THEN  ' in max TTR Range
            TargetDesignatedStatus = i_i
            TargetTrackedStatus = i_i
            ComputerStartFlag = 1 ' start computer
            DesignateAzRads = CalPPI_AzRad
            DesignateRadiusPix = CalPPI_RadiusPix
            GOSUB E_Message1
            '      123456789012345
            PRINT "               "
            GOSUB E_Message2
            PRINT "               "
            COLOR white
        ELSE
            GOSUB E_Message1
            '      123456789012345
            PRINT "Out of         "
            GOSUB E_Message2
            PRINT "TTR Range      "
            COLOR white
        END IF
    END IF
NEXT ' i_i = 1 to TargetsMax
END IF
 
RETURN

    IF ZTT_SpriteLastLoc <> -1 THEN

UpdateIntercept:      'also sends steering commands during cruise

' calculate Predicted Intercept Point
' based on previous 
DIM UpdateInterceptDebugCase0 = 0

DIM dTryPx, dTryPy, dTryPz 
DIM dTryMx, dTryMy, dTryMz 
DIM dTryTGRange, dTryTRad, dTryMGRange 
DIM dMx, dMy, dMRange 	' missile data
DIM dTx, dTy, dTRange 	' target  data

DIM dTryMTime, dTryMRad   ' static between runs
DIM dMPx, dMPy, dMPz   ' midpoint between missile and PredInt
DIM dWTime, dWTime2 
DIM fMVRadN, fM2Ix,fM2Iy,fM2Ir,fMGoalRadN,fMErrorRadH 
DIM GyroSettledTime

IF (TargetTrackedStatus = 0) THEN
    ' move predicted intercept point to 0
    'MSL_Status = 0
    MSL_FlightTime = 0
    ComputerSettledStatus = 0
END IF
SELECT CASE MSL_Status
CASE 0 ' pre-launch
    IF (TargetTrackedStatus <> 0) THEN
        ComputerSettledStatus = 1
    END IF
    TTR_BurstDither = 1
    ' following code clears G Meter after manual burst
    
    MSL_GYaw  = 0
    MSL_GPitch  = 0
    
    
    IF  dTryMTime < dReleaseTime THEN : dTryMTime = dReleaseTime : END IF
    IF  dTryMTime > 150          THEN : dTryMTime = 150          : END IF
    IF  dTryMRad  > Pi           THEN : dTryMRad  = PiTimes2     : END IF
    IF  dTryMRad  < -Pi          THEN : dTryMRad  = -Pi          : END IF
    FOR i_i=0 TO 3.99 
        dTryPx = TTR_X + TTR_DX*dTryMTime ' projected target at projected time
        dTryPy = TTR_Y + TTR_DY*dTryMTime  '  "
        dTryTGRange = SQR( dTryPx*dTryPx + dTryPy*dTryPy ) ' projected range of PIP from launcher
        'if ( dTryPx <> 0 AND dTryPy <> 0 ) then
        dTryTRad = ATAN2( dTryPy, dTryPx)  ' angle of projected target from current target
        'else
        '    dTryTRad = 0
        'end if
        dTryMGRange  = dReleaseRange + dReleaseSpeed*(dTryMTime - dReleaseTime) 
        ' progected missile range from launcher
        dTryMx = dTryMGRange * COS(dTryMRad) ' projected missile position
        dTryMy = dTryMGRange * SIN(dTryMRad) '    "
        dTryMz = dReleaseZ
        IF ( dTryMx <> 0 AND dTryMy <> 0 ) THEN
            dTryMRad = ATAN2( dTryMy, dTryMx) ' angle of projected from current (launcher)
        ELSE
            dTryMRad = 0
        END IF
        
        
        ' if i is even do angle, else do time
        IF ( INT(i_i) AND 1 ) = 0 THEN
            dTryMRad += (dTryTRad - dTryMRad)/2
        ELSE
            '               dTryMTime += ( (dTryTGRange - dTryMGRange)/dTryMGRange)/2 
            dTryMTime += ( (dTryTGRange - dTryMGRange)/dReleaseSpeed)/2 
        END IF
        
        
    NEXT i
    dTryMGRange  = dReleaseRange + dReleaseSpeed*(dTryMTime - dReleaseTime) ' update after last change
    
    PIP_Sec = dTryMTime
    IF PIP_Sec > 149 THEN
        ComputerSettledStatus = 0
        GOSUB E_Message1
        '      123456789012345
        PRINT "Pred. Intercept "
        GOSUB E_Message2
        PRINT "> 150 seconds   "
        COLOR white
    ELSE
        GOSUB E_Message1
        '      123456789012345
        PRINT "               "
        GOSUB E_Message2
        PRINT "               "
        COLOR white
    END IF
    PIP_Rad = dTryMRad
    MSL_PP_YawRad = dTryMRad  ' initialize to gyro angle
    
    PIP_MilNorthRad = -dTryTRad + Pi/2 ' flip to 0 north increase clockwise
    IF PIP_MilNorthRad < 0 THEN : PIP_MilNorthRad += PiTimes2 : END IF
    PIP_X   = dTryMGRange*COS(PIP_Rad)
    PIP_Y   = dTryMGRange*SIN(PIP_Rad)
    PIP_Z   = TTR_Z+TTR_DZ*PIP_SEC
    ' clamp PIP_Z
    IF PIP_Z < 1 Then
        PIP_Z = 1
    ELSEIF PIP_Z > 80000/3 Then
        PIP_Z = 80000/3
    END IF
    MSL_GyroDegrees = PIP_MilNorthRad*Rad2Deg ' updated prelaunch only
CASE 1 ' gyro settling
    MSL_GYaw = 0
    MSL_GPitch = 0
    COLOR white  ' 
    
    LOCATE StatusPrintYOffset+11,StatusPrintXOffset ' blank previous miss distance
    PRINT "                                                                ";        
    
    
CASE 2 ' boost
CASE 3 ' roll stab
CASE 4 ' dive , issue dive commands
    IF MSL_Speed < 3.3*Mach1 THEN
        MSL_Speed += (3.3*Mach1 - MSL_Speed)*0.01
    END IF
    
    MSL_GYaw = 0
    MSL_GPitch = -9
    IF MSL_PP_ElRad < Pi/16    THEN  ' wait till less than 67 degree climb before checking term dive,  for now
        z_f = MSL_Z + MSL_Speed*SIN(MSL_PP_ElRad)*PIP_Sec ' missile height + gives rate of climb* Time = aim point
        x_f = MSL_Speed*COS(MSL_PP_ElRad)*PIP_Sec ' approx radius in PP Plane 
        y_f = 0.5*0.5* OneG * PIP_Sec*PIP_Sec ' 1/2 g fall distance in PP Plane
        IF z_f - y_f < PIP_Z THEN  ' about 1/2 g flight 
            MSL_Status = 5   ' stop dive
            MSL_GPitch = -0.5 ' give nominal flight g's, show 1 g fall
        END IF
    END IF ' MSL_ElRad
    
    '------------    check burst ---------------------------
    IF PIP_Sec < 1 THEN  '--------------------------
        MSL_Status = 6  ' indicate burst 
        'MatchTTR_MTR = 1
        Burst_Timer = 0  ' indicate just burst
        RETURN ' ------------------------------------
    END IF
    
    
    
CASE 5 ' cruise, issue steering commands & send burst command
    
    IF MSL_Speed < 3.3*Mach1 THEN
        MSL_Speed += (3.3*Mach1 - MSL_Speed)*0.01
    END IF
    dTryMtime = PIP_Sec
    ' determine approx missile flight xy relative to target xy to select
    '       deflection shooting or in-line shooting
    '
    ' proposed, find whether the missile will intersect with the target
    '           at less than 45 degrees (in-line) (current steering works well here)
    '        or greater than 45 degrees (deflection) (current steering miserable)
    '
    '   what is a good general method? maybe figure which quadrant (off set by 45 degrees)
    '          the predicted intercept is - is OK for straight line targets
    '              evasion may have to do in-flight changes ?
    x_f = MSL_GyroDegrees + 45  ' make deflection angle, perpendicular = +- 90 degrees
    '            somewhat head on is positive, somewhat over targets sholder is negative
    
    
    ' the following seems to work well for in-line shooting
    Case5InLine:
    FOR i_i=0 TO 3.99 
        dTryPx = TTR_X + TTR_DX*dTryMTime  ' projected targetPIP range  from missile now in XY plane
        dTryPy = TTR_Y + TTR_DY*dTryMTime
        dTryTGRange = SQR( (dTryPx-MSL_X)^2 + (dTryPy-MSL_Y)^2 ) ' ground range of target PIP from missile
        x_f = dTryPx - MSL_X
        y_f = dTryPy - MSL_Y
        'if ( x_f <> 0 OR y_f <> 0 ) then
        dTryTRad = ATAN2( y_f, x_f) ' angle from target PIP to Missile
        'else
        '    dTryTRad = 0
        'end if
        'above looks good 
        ' find projected range of MSL_PIP from missile now in XY plane
        dTryMGRange = MSL_Speed*dTryMTime
        ' find angle to T_PIP from Missile
        x_f = dTryPx - MSL_X
        y_f = dTryPy - MSL_Y
        'if ( MSL_DX <> 0 OR MSL_DY <> 0 ) then
        dTryMRad = ATAN2( MSL_DY, MSL_DX) ' angle of current missile ground motion
        'else
        '   dTryMRad = 0
        'end if
        
        
        ' if i is even do angle, else do time
        IF ( INT(i_i) AND 1 ) = 0 THEN
            dTryMRad += (dTryTRad - dTryMRad)/2
        ELSE
            dTryMTime += ( (dTryTGRange - dTryMGRange)/MSL_Speed)/2 
        END IF
        WHILE dTryMRad < Pi : dTryMRad += PiTimes2 : WEND
        WHILE dTryMRad > Pi
            dTryMRad -= PiTimes2
        WEND
    NEXT i
    dTryMGRange  = MSL_Speed*(dTryMTime) ' update after last change
  
        ' PIP_Sec = dTryMTime
    IF PIP_Sec - DynamicsInterval*0.75 < dTryMTime THEN ' clamp time modification to make missile path look better
        PIP_Sec -= DynamicsInterval*0.75 ' prevent time from going backward
        'LOCATE 7,2
        'PRINT "-"
    ELSEIF PIP_Sec - DynamicsInterval*1.25 > dTryMTime THEN
        PIP_Sec -= DynamicsInterval*1.25
        'LOCATE 7,2
        'PRINT "+"
    ELSE
        PIP_Sec = dTryMTime
        'LOCATE 7,2
        'PRINT "X"
    END IF
    PIP_Rad = dTryMRad
    PIP_MilNorthRad = -dTryTRad + Pi/2 ' flip to 0 north increase clockwise
    IF PIP_MilNorthRad < 0 THEN : PIP_MilNorthRad += PiTimes2 : END IF
    
    PIP_X   = dTryPx
    PIP_Y   = dTryPy
    PIP_Z   = TTR_Z+TTR_DZ*PIP_SEC
    ' clamp PIP_Z
    IF PIP_Z < 1 Then
        PIP_Z = 1
    ELSEIF PIP_Z > 80000/3 THEN
        PIP_Z = 80000/3
    END IF
    
    '------------    check burst ---------------------------
    IF PIP_Sec < 1 THEN  '--------------------------
        MSL_Status = 6  ' indicate burst 
        MatchTTR_MTR = 1
        Burst_Timer = 0  ' indicate just burst
        RETURN ' ------------------------------------
    END IF
    ' generate steering commands
    'dTryTRad = atan2( y_f, x_f) ' angle from target PIP to Missile
    'dTryMRad = atan2( MSL_DY, MSL_DX) ' angle of current missile ground motion
    ' generate missile ground path error
    'x_f = dTryTRad - dTryMRad '- Pi   ' reverse missile direction vector
    x_f = (dTryMRad -dTryTRad)*10    '  
    WHILE x_f < Pi : x_f += PiTimes2 : WEND
    WHILE x_f > Pi : x_f -=PiTimes2 : WEND
    IF  Debug THEN  
        LOCATE 10,1
        PRINT USING "10 ##.### ##.### ##.###";x_f,dTryTRad,dTryMRad
    END IF
    MSL_GYaw = x_f  '/SQR(PIP_Sec) 
    MSL_GPitch = (PIP_Z + (0.5*0.5*OneG*PIP_Sec*PIP_Sec) - MSL_DZ*PIP_Sec- MSL_Z)/PIP_Sec
    IF MSL_GYaw > 9 THEN   ' clamp steering commands
        MSL_GYaw = 9
    ELSEIF   MSL_GYaw < -9 THEN
        MSL_GYaw = -9
    END IF
    IF MSL_GPitch > 9 THEN
        MSL_GPitch = 9
    ELSEIF MSL_GPitch < -9 THEN
        MSL_GPitch = -9
    END IF
    IF  Debug THEN
        LOCATE 11,1
        PRINT USING "11 ###.## ###.##";MSL_GPitch,MSL_GYaw
    END IF 
    GOTO EndCase5
    ' -------------- end of in-line steering
    Case5Deflection:
    LOCATE 11,1
    PRINT USING "11 Deflection Angle = ###.##          ";x_f
    
    GOTO EndCase5
    EndCase5:
    
    
CASE 6 ' burst status
    
    IF PIP_Sec > -.01 THEN
        PIP_Sec -= DynamicsInterval ' coast missile and target 
    END IF
    IF PIP_Sec > 0 THEN
        TTR_X += TTR_DX*DynamicsInterval  ' yards 
        TTR_Y += TTR_DY*DynamicsInterval  ' yards 
        TTR_Z += TTR_DZ*DynamicsInterval  ' yards 
        MSL_X += MSL_DX*DynamicsInterval  ' yards
        MSL_Y += MSL_DY*DynamicsInterval  ' yards
        MSL_Z += MSL_DZ*DynamicsInterval  ' yards
        DIM AS INTEGER mx,my,mz,mr
        mx = ABS(TTR_X - MSL_X)/60
        my = ABS(TTR_Y - MSL_Y)/60
        mz = ABS(TTR_Z - MSL_Z)/60
        mr = SQR(mx*mx + my*my + mz*mz)
        
        LOCATE StatusPrintYOffset+11,StatusPrintXOffset
        PRINT USING "Miss distance yards  X= ### Y= ### Z= ### Radius= ###  ";mx,my,mz,mr
    ELSEIF MatchTTR_MTR THEN
        MSL_X = TTR_X
        MSL_Y = TTR_Y
        MSL_Z = TTR_Z
        MatchTTR_MTR = 0
        
    END IF
    Burst_Timer += DynamicsInterval  ' update burst
    IF Burst_Timer > 7 THEN ' OR TargetDesignatedStatus <> 0 then
        MSL_Status = 0
        Target_X(TargetTrackedStatus) = 500000 ' move target out of range for recycling
        TargetTrackedStatus =0 ' show grass
        TargetDesignatedStatus = 0 
        ComputerSettledStatus = 0
        TTR_BurstDither = 1
    ELSEIF Burst_Timer > 1 THEN
        TargetDX(TargetTrackedStatus) *= 0.96
        TargetDY(TargetTrackedStatus) *= 0.96
        TargetDZ(TargetTrackedStatus) *= 0.96
        TTR_BurstDither = 1 + RND() ' 
        MSL_GPitch = 0
        MSL_GYaw = 0
        
    END IF
    
    
END SELECT

ComputeMissilePosition:  ' missile position and polar ? 
DIM VTheta
SELECT CASE MSL_Status
CASE 0 ' prefire, prelaunch
    MSL_FlightTime = 0
    GyroSettledTime = 0
    IF FireButtonStatus <> 0 THEN 
        MSL_Status = 1 
        LauncherNumber += 1 ' go to next launcher
    END IF
    MSL_X = Launcher_X + LauncherNumber*14 + SectionNumber* 15' give some variablilty 
    MSL_DX = 0
    MSL_Y = 0
    MSL_DY = 0
    MSL_Z = 0
    MSL_DZ = 0
    MSL_PP_ElRad = Pi/2 ' straight up
    VTheta = 0 ' radians per second
CASE 1 ' Fire Button Pushed, Gyro settle
    GyroSettledTime += DynamicsInterval
    PIP_Sec -= DynamicsInterval
    IF GyroSettledTime > 1.99 THEN  : MSL_Status = 2 : END IF
    
CASE 2 ' Lift_off, Boost
    MSL_DZ += OneG*BoostGs*DynamicsInterval '  10 yards/sec/sec = 1 g, boost = 25 g
    MSL_Z += MSL_DZ*DynamicsInterval
    MSL_FlightTime += DynamicsInterval
    PIP_Sec -= DynamicsInterval
    
    IF MSL_FlightTime > 3.49 THEN  : MSL_Status = 3 : END IF
    
CASE 3 ' Roll Stab
    'MSL_DZ = 0 '
    MSL_Z += MSL_DZ*DynamicsInterval
    
    MSL_FlightTime += DynamicsInterval
    PIP_Sec -= DynamicsInterval
    
    IF MSL_FlightTime > 4.99 THEN  
        MSL_Status = 4 
        ' use a PP Plane, containing MSL_GyroRad, and MSL_Z from XY view
        MSL_PP_X = 0 ' = MSL Ground Range
        MSL_Speed = MSL_DZ ' use the boost end speed as missile speed
    END IF
CASE 4,5 ' Dive and cruise - make dive triangles, latteral g's
    ' MSL_GPitch MSL_GYAW  set by compute steering
    ' compute new MSL_PP_ElRad
    '  **** currently, a dive to the north stops climb, goes flat
    MSL_PP_Hypot = MSL_Speed*DynamicsInterval  ' compute side of dive triangle
    VTheta = MSL_GPitch*OneG*DynamicsInterval
    DeltaX = VTheta*DynamicsInterval + _
    0.5*MSL_GPitch*OneG*DynamicsInterval*DynamicsInterval
    DeltaRad = ATAN2(DeltaX,MSL_PP_Hypot)   ' compute angle of vertical bend
    
    ' place dive triangle onto last velocity vector
    MSL_PP_ElRad += DeltaRad ' new Pitch or El angle
    
    ' compute new MSL_PP_YawRad
    ' MSL_PP_Hypot already computed
    DeltaX = 0.5*MSL_GYaw*OneG*DynamicsInterval*DynamicsInterval  ' compute end of dive triangle
    DeltaRad = ATAN2(DeltaX,MSL_PP_Hypot)   ' compute angle of vertical bend
    
    ' place dive triangle onto last velocity vector
    MSL_PP_YawRad -= DeltaRad ' new Yaw angle 'backwards???? now trying -=
    WHILE MSL_PP_YawRad < Pi : MSL_PP_YawRad += PiTimes2 : WEND
    WHILE MSL_PP_YawRad > Pi : MSL_PP_YawRad -= PiTimes2 : WEND
    
    ' I think the above two angles are correct, the elevation angle and the yaw anglel,
    '   now how to connect them to reality?
    ' So - we now have a new vertical angle and a new "horizontal" angle,
    '     actually a resulting length "MSL_PP_Hypot" (our assumption/approximation) on the new 3-D vector
    '  the projection on the X-Y axis is 
    '            foreshortened by the elevation angle
    DIM ForeShortXY,ForeShortXZ 
    ForeShortXY = MSL_PP_Hypot*COS(MSL_PP_ElRad) ' length on that plane
    x_f =  ForeShortXY*COS(MSL_PP_YawRad)
    ' a gross cheat ******
    IF PIP_Sec < FullSteeringTime THEN
        MSL_X += MSL_DX*DynamicsInterval
        MSL_Y += MSL_DY*DynamicsInterval
        MSL_Z += MSL_DZ*DynamicsInterval
    ELSE
        MSL_X += x_f          
        MSL_DX = x_f/DynamicsInterval
        y_f =  ForeShortXY*SIN(MSL_PP_YawRad)
        MSL_Y += y_f          
        MSL_DY = y_f/DynamicsInterval
        
        z_f = MSL_PP_Hypot*SIN(MSL_PP_ElRad)
        MSL_Z += z_f   ' **** zerp if north !!!!
        MSL_DZ = z_f/DynamicsInterval
    END IF
    
    MSL_FlightTime += DynamicsInterval
    IF MSL_Status <> 5 AND MSL_Status <> 6 THEN
        PIP_Sec -= DynamicsInterval
    END IF
    
    
CASE 6 ' Burst
    'MSL_X = Launcher_X
    MSL_DX = 0
    'MSL_Y = 0
    MSL_DY = 0
    'MSL_Z = 0
    MSL_DZ = 0
    
    
END SELECT
'LOCATE 5,2
'OldMSL_GS = MSL_GS
'MSL_GS = SQR( MSL_DX*MSL_DX + MSL_Dy*MSL_Dy)
'Print " delta Missile gnd speed = ";MSL_GS-OldMSL_GS
'LOCATE 6,2
'PRINT USING " Missile deltas = ####.# ####.# ####.# ";MSL_DX,MSL_DY,MSL_DZ

RETURN

        IF SQR(Target_X(i_i)*Target_X(i_i) + Target_Y(i_i)*Target_Y(i_i) ) > PPI_MaxRange THEN ' convert slot to new target
            DO
                Target_X(i_i) = PPI_MaxRange*(1.0-2.0*RND())
                Target_Y(i_i) = PPI_MaxRange*(1.0-2.0*RND())
                z_f = SQR(Target_X(i_i)*Target_X(i_i) + Target_Y(i_i)*Target_Y(i_i) )
            LOOP WHILE z_f < PPI_MaxRange-50000  OR z_f > PPI_MaxRange
            Target_Z(i_i) = 1000 + 10000*RND()  ' altitude
            TargetDZ(i_i) = 0 ' steady altitude
            TargetDX(i_i) = -Target_X(i_i)/400 +100-200*RND() 
            TargetDY(i_i) = -Target_Y(i_i)/400 +100-200*RND()  
        END IF
    NEXT i_i
    RETURN

            END

        'locate 2,80
        'print AutoTargetID;
        'print MouseXCurrent;MouseYCurrent
        MouseButtonsCurrent = 1 ' show designate
        GOSUB MouseInPPI  ' try to track the target
         AutoTrackPauseSec = ThisTime

        IF  AutoTrackPauseSec + 1.5 > ThisTime THEN
            RETURN
        END IF '
        IF TargetTrackedStatus = 0 THEN   ' out of range 
            AutoMode = 4
            Return
        END IF ' TargetTrackedStatus

        IF ComputerSettledStatus = 0 then

            RETURN
        END IF
        IF PIP_Sec > 30 OR Target_Z(AutoTargetID) > 30000/3 Then ' practical target
            IF PIP_Sec <  AutoMinimumTTI THEN  ' practical taget is a minimum
                 AutoMinimumTTI = PIP_Sec
                 AutoMinimumTargetNumber = AutoTargetID
            END IF ' PIP_Sec  ' < 
        ELSE  ' in dead zone
            ' set message
            ' wait 
        END IF ' PIP_Sec ' > 30 
        AutoMode = 3
    CASE 3  
        AutoMode = 4
    CASE 4 
       AutoTargetID += 1 ' go to next target
        IF AutoTargetID <= TargetsMAX then ' go to next target
            AutoMode = 1 ' 
            RETURN
        END IF 'AutoTargetID <=
        IF AutoMinimumTargetNumber = 0 Then
            AutoMode = 0 '  no best target, start over
            RETURN
        END IF
        ' Track selected target
        MouseXCurrent = PPI_XOffSet + PPI_MaxRad + Target_X(AutoMinimumTargetNumber)/PPI_Pix2Yard
        MouseYCurrent = PPI_YOffSet + PPI_MaxRad - Target_Y(AutoMinimumTargetNumber)/PPI_Pix2Yard ' flipped
        MouseButtonsCurrent = 1 ' show designate
        GOSUB MouseInPPI  ' try to track the target
        IF TargetTrackedStatus = 0 THEN   ' out of range 
            AutoMode = 0
            Return
        END IF ' TargetTrackedStatus
        AutoTrackPauseSec = ThisTime
        AutoMode = 5
    CASE 5  ' target tracked, wait for computer to settle
        IF  AutoTrackPauseSec + 1.5 > ThisTime THEN
            RETURN
        END IF '
        ' turn OFF IFF
        MouseXCurrent = IFF_Button1X + IFF_Button1WX/2
        MouseYCurrent = IFF_Button1Y + IFF_Button1WY/2
        MouseButtonsCurrent = 0 ' show un-designate
        GOSUB PressingIFF_Buttons   ' Is BCO pressing IFF BUTTON ? 

        IF ComputerSettledStatus = 0 then   
            AutoMode = 0  ' probably PIP out of range
            RETURN
        END IF

        AutoMode = 6
    CASE 6  ' try to fire
        'CONST FireButtonX = 600,  FireButtonY  = 900
        'CONST FireButtonWX = 40,  FireButtonWY = 40

        MouseXCurrent = FireButtonX + FireButtonWX/2
        MouseYCurrent = FireButtonY + FireButtonWY/2

        IF FireButtonStatus = 0 then

        END IF
        AutoTrackPauseSec = ThisTime
        AutoMode = 7
    CASE 7  
        IF  AutoTrackPauseSec + 1.5 > ThisTime THEN
            RETURN
        END IF '
        ' Release FIRE button
        MouseXCurrent = FireButtonX + FireButtonWX/2
        MouseYCurrent = FireButtonY + FireButtonWY/2
        MouseButtonsCurrent = 0 ' show un-designate
        GOSUB PressingFireButtonQ   ' Is BCO pressing fire button and all systems GO ? 

         AutoMode = 8
    CASE 8 
        IF PIP_Sec < 15 THEN  ' energize IFF
            MouseXCurrent = IFF_Button1X + IFF_Button1WX/2
            MouseYCurrent = IFF_Button1Y + IFF_Button1WY/2
            MouseButtonsCurrent = 1 ' show un-designate
            GOSUB PressingIFF_Buttons   ' Is BCO pressing IFF BUTTON ? 
            ' CONST IFF_Button1X = 600,  IFF_Button1Y  = 700
            'CONST IFF_Button1WX = 40,  IFF_Button1WY = 40
        END IF
        IF MSL_Status <> 6 Then ' = burst
            RETURN
        END IF 

        AutoMode = 0
        
    END SELECT
    
    RETURN

ComputeRadiusCurvature:
'  July 4 - lets play radius of curvature games
'         and internet comment is that the radius of curvature in 3 space
'   can be found from the distance of three points on a 3 space circle
'  http://www.physicsforums.com/showthread.php?t=173847
'      Greek000
'
'Well, you only need to find the distances between these three points in 3D space, 
'which correspond to the lengths of the triangle sides. This is an easy task. 
'If we name these distances a, b, c then the radius R of the circumscribed circle is:
'
'                  abc
'     R = ---------------------------------------------------
'          SQR( 2a^2b^2 + 2b^2c^2 + 2c^2a^2 - a^4 -b^4 - c^4 )
'
'When the points are colinear the quantity inside the square root becomes zero, 
'and therefore the radius becomes infinite as it should.  
'  Missile Position History Arrays
'DIM  MPHA_X(3),MPHA_Y(3),MPHA_Z(3)
DIM ad,bd,cd,dx,dy,dz,MSL_Radius,DenominatorSquared  
    FOR i_i =2 to 0 STEP -1 ' move history along
        MPHA_X(i_i+1) = MPHA_X(i_i)
        MPHA_Y(i_i+1) = MPHA_Y(i_i)
        MPHA_Z(i_i+1) = MPHA_Z(i_i)
        'LOCATE 8+i_i,2
        'print MPHA_X(i_i+1);"   ";MPHA_Y(i_i+1);"   ";MPHA_Z(i_i+1);"   "
    NEXT   ' i_i 
    MPHA_X(0) = MSL_X  ' enter current values
    MPHA_Y(0) = MSL_Y
    MPHA_Z(0) = MSL_Z
    If MSL_Status = 3 OR MSL_Status = 4 OR MSL_Status = 5 Then ' Roll stab,dive,cruise
        dx = MPHA_X(0)-MPHA_X(1)
        dy = MPHA_Y(0)-MPHA_Y(1)
        dz = MPHA_Z(0)-MPHA_Z(1)
        'LOCATE  5,2
        'PRINT " dx = ";dx;" dy = ";dy;" dz = ";dz;

        ad = SQR( dx*dx +dy*dy + dz*dz) ' distance  between points
        dx = MPHA_X(2)-MPHA_X(1)
        dy = MPHA_Y(2)-MPHA_Y(1)
        dz = MPHA_Z(2)-MPHA_Z(1)
        'LOCATE  6,2
       ' PRINT " dx = ";dx;" dy = ";dy;" dz = ";dz;
        bd = SQR( dx*dx +dy*dy + dz*dz) ' distance  between points
        dx = MPHA_X(0)-MPHA_X(2)
        dy = MPHA_Y(0)-MPHA_Y(2)
        dz = MPHA_Z(0)-MPHA_Z(2)
        'LOCATE  7,2
        'PRINT " dx = ";dx;" dy = ";dy;" dz = ";dz;

        cd = SQR( dx*dx +dy*dy + dz*dz) ' distance  between points
        DenominatorSquared = 2*ad*ad*bd*bd + 2*bd*bd*cd*cd + 2*cd*cd*ad*ad _
             - ad*ad*ad*ad - bd*bd*bd*bd -cd*cd*cd*cd
        IF DenominatorSquared <= 0 THEN
            MSL_Radius = 99999 ' funny value
        ELSE
            MSL_Radius = ad*bd*cd/SQR(DenominatorSquared)
        END IF
    END IF
    LOCATE 4,2
    PRINT USING "MSL TurnRadius= #######  gs=  ###.#  ";MSL_Radius, (MSL_Speed*MSL_Speed/MSL_Radius)/9.9  
RETURN
